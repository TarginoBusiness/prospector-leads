name: Deep OSINT (sinais de interesse)

on:
  schedule:
    - cron: "0 6 * * *"   # diario 6h UTC (3h Brasilia)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max leads pra aprofundar"
        default: "1000"

jobs:
  deep_osint:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # ate 4h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements-scrapers.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: prod
        run: python -m enrichers.run_deep_osint ${{ github.event.inputs.limit || '1000' }}
