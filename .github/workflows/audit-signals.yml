name: Audit signals (verifica false positives)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements-scrapers.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m db.audit_signals
