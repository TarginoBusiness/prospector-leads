name: Cleanup stale runs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # roda a cada 30min — auto-fecha runs orfas

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements-scrapers.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m db.cleanup_stale_runs
