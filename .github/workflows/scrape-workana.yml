name: Scrape Workana (intent alto)

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements-scrapers.txt
      - run: playwright install --with-deps chromium
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: prod
        run: python -m scrapers.workana
