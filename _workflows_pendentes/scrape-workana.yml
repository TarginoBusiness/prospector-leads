name: Scrape Workana (intent alto)

on:
  schedule:
    - cron: "0 */1 * * *"   # a cada 1h (UTC) — leads quentes, tempo importa
  workflow_dispatch:        # permite rodar manual pelo botao

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Workana scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: prod
        run: python -m scrapers.workana
