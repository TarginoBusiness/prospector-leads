# Sinais de INTERESSE passivo da empresa-lead.
# Diferente de intent_keywords.yaml (que e pedido explicito "preciso de"),
# interest_keywords e mencao em qualquer contexto: site, bio do Instagram,
# anuncio de vaga, post recente, etc. Sinal de "to no momento certo".
#
# REGRA NOVA: sinais tem PESO DOMINANTE no score. 1 sinal sozinho ja deve
# elevar significativamente o lead. Lead com 2+ sinais quase sempre vai
# pro topo do ranking.

categorias:

  ia_mencao:
    descricao: "Empresa ja mencionou IA / chatgpt em algum contexto publico"
    boost: 40
    # REMOVIDOS por ambiguidade: 'llm' (= diploma Master of Laws — false
    # positive em advocacia), 'prompt' (= 'entrega prompt'/'atendimento
    # prompt'). So termos INEQUIVOCOS de IA.
    palavras:
      - inteligencia artificial
      - chatgpt
      - chat gpt
      - machine learning
      - aprendizado de maquina
      - agente de ia
      - agentes de ia
      - openai
      - generative ai
      - ia generativa
      - automacao com ia
      - automacao com inteligencia artificial
      - rede neural

  automacao_mencao:
    descricao: "Empresa fala sobre automatizar processos"
    boost: 35
    # REMOVIDO 'rpa' (acronimo ambiguo demais). Mantidos termos claros.
    palavras:
      - automacao
      - automatizar
      - automatizamos
      - automatizado
      - workflow automatico
      - fluxo automatizado
      - processos automaticos
      - processo automatizado
      - otimizacao de processos
      - robotic process automation

  whatsapp_automation:
    descricao: "Empresa esta no contexto WhatsApp / chatbot (servico principal nosso)"
    boost: 50
    palavras:
      - whatsapp business
      - api whatsapp
      - chatbot
      - bot de atendimento
      - atendimento automatico
      - atendimento 24h
      - resposta automatica
      - menu interativo whatsapp
      - atendimento via whatsapp
      - atendimento pelo whatsapp
      - fale conosco pelo whatsapp
      - chame no whatsapp
      - agende pelo whatsapp

  agendamento_online:
    descricao: "Empresa ja tem presenca digital ativa (agenda online) — fruto baixo, otimo prospecto pra automacao de atendimento"
    boost: 25
    palavras:
      - agendamento online
      - agende online
      - agende sua consulta
      - agende sua avaliacao
      - marque sua consulta
      - agendamento pela internet
      - agende seu horario
      - reserva online
      - formulario de contato

  vaga_tech:
    descricao: "Empresa tem vaga aberta de tech (vai contratar dev/TI = comprar tech)"
    boost: 45
    palavras:
      - vaga desenvolvedor
      - vaga programador
      - vaga ti
      - vaga tecnologia
      - vaga frontend
      - vaga backend
      - vaga fullstack
      - oportunidade desenvolvedor
      - contratamos desenvolvedor
      - estagio tecnologia
      - software house

  # ===================================================================
  # DEMANDA EXPLICITA — PESO MAXIMO.
  # A empresa esta literalmente contratando pra pre-atendimento/atendimento,
  # ou expressa necessidade do que a gente vende (site, automacao). Esse eh
  # o sinal mais forte: nao eh "talvez", eh demanda confirmada e verificavel.
  # Card aparece em AMARELO na ficha do lead.
  # ===================================================================
  vaga_atendimento:
    descricao: "DEMANDA EXPLICITA: contratando atendente/recepcao/SAC/pre-atendimento — carga de atendimento manual = prospecto perfeito pra nossa automacao de WhatsApp"
    boost: 90
    palavras:
      - atendente de whatsapp
      - atendente whatsapp
      - vaga atendente
      - vaga de atendente
      - vaga para atendente
      - contratando atendente
      - contratamos atendente
      - vaga recepcionista
      - vaga de recepcionista
      - vaga para recepcionista
      - contratando recepcionista
      - vaga sac
      - vaga de sac
      - vaga call center
      - vaga teleatendimento
      - vaga operador de telemarketing
      - pre atendimento
      - pre-atendimento
      - central de atendimento
      - vaga assistente administrativo
      - vaga secretaria
      - estamos contratando atendente
      - precisa-se de atendente
      - precisa se de atendente

  necessidade_explicita:
    descricao: "DEMANDA EXPLICITA: empresa expressa necessidade do que vendemos (site, app, automacao). Card AMARELO na ficha."
    boost: 80
    palavras:
      - precisa de site
      - preciso de um site
      - orcamento de site
      - orcamento para site
      - refazer o site
      - refazer nosso site
      - site desatualizado
      - quero um site
      - desenvolvimento de aplicativo
      - preciso automatizar
      - quero automatizar
      - precisamos automatizar
      - precisa de chatbot
      - quero um chatbot
      - preciso de um sistema
      - quero um sistema

  site_modernizacao:
    descricao: "Empresa esta atualizando/refazendo presenca digital"
    boost: 30
    # REMOVIDOS genericos: 'reformulacao' (reforma de qualquer coisa).
    palavras:
      - site em construcao
      - novo site
      - novo portal
      - reformulacao do site
      - lancamento digital
      - nova plataforma digital
      - novo aplicativo

  transformacao_digital:
    descricao: "Empresa investe em digitalizacao"
    boost: 35
    # REMOVIDO 'inovar' (toda empresa diz isso — generico demais).
    palavras:
      - transformacao digital
      - digitalizacao
      - inovacao tecnologica
      - modernizar processos
      - tecnologia 4.0
      - industria 4.0
      - data driven

  dor_explicita:
    descricao: "Empresa expressa pain (frustracao operacional, tempo demais, etc)"
    boost: 40
    palavras:
      - planilha demais
      - excel manual
      - perdemos tempo
      - lentidao operacional
      - retrabalho
      - sobrecarga
      - processos manuais

# Teto cumulativo de boost (categorias somadas) — sem teto efetivo,
# multiplos sinais dominam o score
teto_cumulativo: 100
