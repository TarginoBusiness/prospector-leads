# Sinais de INTERESSE passivo da empresa-lead.
# Diferente de intent_keywords.yaml (que e pedido explicito "preciso de"),
# interest_keywords e mencao em qualquer contexto: site, bio do Instagram,
# anuncio de vaga, post recente, etc. Sinal de que a empresa esta no
# momento certo de comprar tech.

categorias:

  ia_mencao:
    descricao: "Empresa ja mencionou IA / chatgpt em algum contexto publico"
    boost: 25
    palavras:
      - inteligencia artificial
      - chatgpt
      - machine learning
      - agente de ia
      - openai
      - copilot
      - llm
      - prompt
      - generative ai
      - automacao com ia

  automacao_mencao:
    descricao: "Empresa fala sobre automatizar processos"
    boost: 20
    palavras:
      - automacao
      - automatizar
      - automatizamos
      - rpa
      - workflow automatico
      - processos automaticos
      - otimizacao de processos

  whatsapp_automation:
    descricao: "Empresa esta no contexto WhatsApp / chatbot"
    boost: 25
    palavras:
      - whatsapp business
      - api whatsapp
      - chatbot
      - bot de atendimento
      - atendimento automatico
      - atendimento 24h
      - resposta automatica
      - menu interativo whatsapp

  vaga_tech:
    descricao: "Empresa tem vaga aberta de tech (vai contratar dev/TI)"
    boost: 30
    palavras:
      - vaga desenvolvedor
      - vaga programador
      - vaga ti
      - vaga tecnologia
      - vaga frontend
      - vaga backend
      - vaga fullstack
      - oportunidade desenvolvedor
      - contratamos desenvolvedor
      - estagio tecnologia
      - software house

  site_modernizacao:
    descricao: "Empresa esta atualizando/refazendo presenca digital"
    boost: 15
    palavras:
      - site em construcao
      - novo site
      - novo portal
      - reformulacao
      - em breve novidades
      - lancamento digital
      - nova plataforma
      - novo app

  transformacao_digital:
    descricao: "Empresa investe em digitalizacao"
    boost: 15
    palavras:
      - transformacao digital
      - digitalizacao
      - inovacao tecnologica
      - modernizar processos
      - inovar
      - tecnologia 4.0
      - industria 4.0
      - data driven

  dor_explicita:
    descricao: "Empresa expressa pain (frustracao operacional, tempo demais, etc)"
    boost: 20
    palavras:
      - planilha demais
      - excel manual
      - perdemos tempo
      - lentidao operacional
      - retrabalho
      - sobrecarga
      - processos manuais

# Teto cumulativo de boost (categorias somadas)
teto_cumulativo: 50
