# Sinais de INTERESSE — REGRA: so vale o que indica ATENDIMENTO HUMANO MANUAL.
#
# A pergunta certa pra avaliar uma keyword:
#   "Isso prova que tem gente respondendo cliente de forma manual?"
# Se a resposta for "sim", vale boost. Se for "talvez/nao", FORA.
#
# REMOVIDAS por nao indicarem atendimento humano:
#   - "agende sua consulta", "agendamento online", "agende sua avaliacao"
#     -> pode ser formulario auto-agendamento, nao prova humano
#   - "inovacao", "tecnologia 4.0", "transformacao digital", "data driven"
#     -> buzzwords genericas, qualquer site fala
#   - "chatbot", "atendimento automatico", "resposta automatica", "bot"
#     -> sinal de que JA tem automacao = nao eh prospecto, eh concorrente
#   - "inteligencia artificial", "machine learning", "openai"
#     -> ambiguo (pode estar vendendo IA, ou estudando, ou citando)
#   - "vaga desenvolvedor", "software house"
#     -> nao tem relacao com atendimento humano
#   - "novo site", "site em construcao"
#     -> nao prova humano atendendo

categorias:

  # WhatsApp atendido por HUMANO — alvo cirurgico pra automatizar
  whatsapp_humano:
    descricao: "Empresa atende manualmente via WhatsApp — prospecto perfeito"
    boost: 50
    palavras:
      - atendimento via whatsapp
      - atendimento pelo whatsapp
      - fale conosco pelo whatsapp
      - fale com a gente no whatsapp
